services:
  - type: web
    name: clear-spend
    runtime: python
    plan: free
    branch: master
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py init-db && gunicorn wsgi:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: clear-spend-db
          property: connectionString
      - key: SESSION_COOKIE_SECURE
        value: "1"

databases:
  - name: clear-spend-db
    plan: free
